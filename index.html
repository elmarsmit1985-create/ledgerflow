<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LedgerFlow</title><meta name="theme-color" content="#0a6e5c">
<style>
:root{--bg:#eceef1;--sf:#dcdfe4;--fld:#f6f7f9;--ink:#16212b;--mu:#55616d;--ln:#c6cbd2;--ac:#0a6e5c;--ac2:#e3f1ee;--rd:#b3261e;--cg:linear-gradient(180deg,#e3e6ea,#d8dce1);--sh:0 1px 0 #fff8 inset,0 2px 3px #14202d1f,0 10px 18px -10px #14202d59;--shh:0 1px 0 #fff8 inset,0 4px 6px #14202d26,0 18px 26px -12px #14202d73;color-scheme:light}

*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}

main{padding:14px;min-width:0}header{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}header input{flex:1;min-width:140px}
#mb{display:none}#off{display:none;background:#9a6700;color:#fff;padding:6px 12px;text-align:center}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}.grid .card{margin:0}.big{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
h2,h3{margin:0 0 10px}.mu{color:var(--mu)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.sp{flex:1}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--fld);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;max-width:100%}
button{cursor:pointer}button.b{background:var(--ac);color:#fff;border-color:var(--ac)}button.g:hover{background:var(--ac2)}button.d{color:var(--rd)}
label{display:block;margin-bottom:8px;color:var(--mu)}label input,label select,label textarea{display:block;width:100%;color:var(--ink);margin-top:3px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td input,td select{width:100%;min-width:70px}td input.s{min-width:60px}
a{color:var(--ac)}.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}.tabs a{padding:6px 12px;border-radius:16px;text-decoration:none;border:1px solid var(--ln);color:var(--ink)}.tabs a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.p{padding:2px 8px;border-radius:10px;background:var(--ac2);color:var(--ac);font-size:12px}.p.Overdue,.p.Cancelled,.p.Void,.p.Expired,.p.Declined{background:#fde8e6;color:#b3261e}.p.Draft{background:var(--ln);color:var(--mu)}
#m{display:none;position:fixed;inset:0;background:#0008;z-index:30;overflow:auto;padding:20px}#m>div{max-width:560px;margin:0 auto;background:var(--sf);border-radius:10px;padding:18px}

@media(max-width:760px){#app{display:block}nav{position:fixed;z-index:20;width:220px;transform:translateX(-100%);transition:.2s}nav.open{transform:none}#mb{display:inline-block}.two{grid-template-columns:1fr}}
@media print{nav,header,.np,#off{display:none!important}#app{display:block}body{background:#fff;color:#000}.card{border:0}}
@page{size:A4;margin:10mm}

.pdoc h1{font-size:22px;margin:0 0 4px}.pdoc .g2{display:flex;justify-content:space-between;gap:16px}.pdoc .meta{display:grid;grid-template-columns:auto auto;gap:1px 30px;color:#555;width:max-content}.pdoc .meta span:nth-child(even){text-align:right}.pdoc .meta b{color:#222}
.pdoc img.lg{max-width:250px;max-height:130px;align-self:flex-start;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pdoc .lb{color:#777;font-weight:700}.pdoc .nm{font-size:17px;font-weight:700;margin:2px 0 8px;color:#111}
.pdoc .ad{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;white-space:pre-line;color:#444}.pdoc .ad b{color:#555;display:block}
.pdoc table{margin-top:16px;border-top:2px solid #ddd}.pdoc th{font-style:italic;color:#888;font-weight:400;padding:6px 4px;border-bottom:2px solid #ddd}.pdoc td{padding:8px 4px;border-bottom:1px solid #ddd;vertical-align:top;white-space:normal}.pdoc .r{text-align:right}
.pdoc .ft{margin-top:auto;border-top:2px solid #ddd;padding-top:12px;display:flex;justify-content:space-between;gap:20px;white-space:pre-line}.pdoc .tt{min-width:240px}.pdoc .tt div{display:flex;justify-content:space-between;gap:20px;margin-bottom:2px}.pdoc .bd{text-align:right;margin-top:16px;color:#999;font-weight:700}.pdoc .bd div{color:#111;font-size:19px}
@media print{:root,[data-t=d]{--bg:#fff;--sf:#fff;--ink:#000;--ln:#ddd}.pdoc{border:0;padding:0;min-height:272mm;max-width:none}main{padding:0}}
#lgs{margin-left:auto;cursor:pointer;display:flex;align-items:center}#lgs img{max-height:40px;max-width:150px;border-radius:4px}#lgs span{border:2px dashed var(--ln);padding:5px 10px;border-radius:6px;color:var(--mu)}.lgph{border:2px dashed #bbb;color:#888;width:230px;height:90px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;text-align:center}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;padding:16px;overflow:auto}#auth .card{width:100%;max-width:410px;margin:auto}#auth label input[type=checkbox],.ck{display:inline-block;width:auto;margin:0 6px 0 0}

/* ---- 3D look ---- */
.card{background:var(--cg);box-shadow:var(--sh)}
nav{box-shadow:2px 0 12px -6px #14202d59}
.grid .card{transition:transform .25s ease,box-shadow .25s ease}
.grid a.card:hover{transform:perspective(800px) translateY(-3px) rotateX(2deg);box-shadow:var(--shh)}
.card.k{border-top:3px solid var(--k)}
.stage{display:flex;align-items:flex-end;gap:6px;padding:8px 6px 0;border-bottom:2px solid var(--ln);overflow:hidden}
.cw{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);--d:18px}
.cv{font-weight:650;font-size:12px;text-align:center;margin-bottom:calc(var(--d) + 4px);white-space:nowrap;font-variant-numeric:tabular-nums}
.cc{display:block;position:relative;width:min(64px,calc(100% - var(--d)));margin-right:var(--d);height:var(--h);background:var(--c);filter:drop-shadow(5px 7px 5px #14202d40);animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms);transition:transform .25s ease}
.cw:hover .cc{transform:translateY(-6px)}
.cl{margin-top:8px;min-height:2.4em;font-size:12px;line-height:1.2;color:var(--mu);text-align:center}
.cc::before,.cc::after,.bars div::before,.bars div::after{content:"";position:absolute;background:inherit}
.cc::before,.bars div::before{left:0;top:calc(var(--d)*-1);width:100%;height:var(--d);transform:skewX(-45deg);transform-origin:0 100%;filter:brightness(1.25)}
.cc::after,.bars div::after{left:100%;top:0;width:var(--d);height:100%;transform:skewY(-45deg);transform-origin:0 0;filter:brightness(.7)}
.bars{height:132px;padding-top:12px;gap:16px;border-bottom:2px solid var(--ln)}
.bars div{--d:9px;--c:#1f9d55;background:var(--c);position:relative;border-radius:0;filter:drop-shadow(3px 4px 3px #14202d40);animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{height:0}}
@media(max-width:760px){.cw{--d:11px}.cv,.cl{font-size:10px}.stage{gap:2px}input,select,textarea{font-size:16px}}
@media(prefers-reduced-motion:reduce){.cc,.bars div{animation:none}.cw:hover .cc,.grid a.card:hover{transform:none}}
@media print{.card{background:none;box-shadow:none}}
</style></head><body>
<div id="off">You are offline. Changes are saved on this device.</div>
<div id="auth" style="display:none"></div>
<div id="app" style="display:none"><nav id="nv"><b>LedgerFlow</b></nav><main><header class="np"><button id="mb" class="g" onclick="$('#nv').classList.toggle('open')">☰</button><input id="gs" placeholder="Search contacts, documents, items" onchange="go('#/search/'+encodeURIComponent(this.value))"><select id="qc" onchange="qc(this.value);this.value=''"><option value="">+ New</option><option value=c>Customer</option><option value=s>Supplier</option><option value=sq>Quote</option><option value=si>Invoice</option><option value=pi>Bill</option><option value=po>Purchase order</option><option value=rc>Customer receipt</option><option value=py>Supplier payment</option><option value=jn>Journal</option><option value=it>Item</option></select><button class="g" id="bell" onclick="bell()">🔔</button><button class="g" onclick="theme()">◐</button><button class="g" id="inst" style="display:none">Install</button><button class="g np" id=who onclick="logout()" title="Sign out"></button><div id=lgs class=np onclick="pickLogo()" title="Click to add or change your company logo"></div></header><div id="v"></div></main></div>
<div id="m" onclick="if(event.target==this)closeM()"><div id="mc"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='ledgerflow.v1',uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
const addD=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fd=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
const R=c=>(c<0?'-':'')+'R '+(Math.abs(c)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const C=v=>Math.round((parseFloat(v)||0)*100+(parseFloat(v)<0?-1e-9:1e-9));
const TR={S:.15,Z:0,E:0,N:0},VN={S:'Standard 15%',Z:'Zero-rated 0%',E:'Exempt',N:'No VAT'};
const K={sq:['Sales Quote','QUO','c'],si:['Sales Invoice','INV','c'],sc:['Sales Credit Note','CN','c'],po:['Purchase Order','PO','s'],pi:['Supplier Invoice','BILL','s'],pc:['Supplier Credit Note','SCN','s']};
const SEED=()=>({biz:{name:'My Business (Pty) Ltd',vat:'',lock:'',inc:false},seq:{},rec:[],recs:[],rules:[],audit:[],contacts:[],items:[],docs:[],pays:[],bank:[],jr:[],
accts:[['1000','Bank','Asset',1],['1010','Petty Cash','Asset',1],['1100','Accounts Receivable','Asset'],['1200','Inventory','Asset'],['1300','VAT Input','Asset'],['2000','Accounts Payable','Liability'],['2100','VAT Output','Liability'],['3000',"Owner's Equity",'Equity'],['3100','Retained Earnings','Equity'],['4000','Sales','Income'],['4100','Other Income','Income'],['5000','Cost of Sales','Cost of Sales'],['5100','Stock Adjustments','Cost of Sales'],['6000','General Expenses','Expense'],['6100','Rent','Expense'],['6200','Utilities','Expense'],['6300','Bank Charges','Expense'],['6400','Salaries','Expense'],['6500','Fuel and Travel','Expense']].map(([code,name,cat,bank])=>({code,name,cat,bank,sys:1,on:1}))});
let D;try{D=JSON.parse(localStorage[KEY])}catch(e){}D=D||SEED();
const save=()=>{if(CU&&curArea&&!syLoad&&lvl(curArea)==1){try{D=JSON.parse(localStorage[KEY])}catch(e){}alert('You only have view access to this area, so that change was not saved.');setTimeout(route,0);return}try{localStorage[KEY]=JSON.stringify(D)}catch(e){alert('Storage is full. Export a backup in Settings.')}cloudDirty()};
const acc=c=>D.accts.find(a=>a.code==c),con=id=>D.contacts.find(x=>x.id==id),itm=id=>D.items.find(x=>x.id==id),doc=id=>D.docs.find(x=>x.id==id);
const log=m=>{D.audit.unshift({t:new Date().toISOString(),m,u:CU&&CU.name})},cap=s=>s[0].toUpperCase()+s.slice(1),banks=()=>D.accts.filter(a=>a.bank&&a.on);
const H=h=>{$('#v').innerHTML=h},modal=h=>{$('#mc').innerHTML=h;$('#m').style.display='block'},closeM=()=>{$('#m').style.display='none'},err=m=>alert(m);
const go=h=>location.hash==h?route():location.hash=h;
/* ---------- engine ---------- */
const chk=d=>{if(D.biz.lock&&d<=D.biz.lock)throw Error('Date is on or before the lock date ('+fd(D.biz.lock)+')')};
function post(src,date,ref,memo,lines,meta){lines=lines.filter(l=>l.dr||l.cr);const d=lines.reduce((s,l)=>s+(l.dr||0),0),c=lines.reduce((s,l)=>s+(l.cr||0),0);if(d!==c)throw Error('Unbalanced entry: debits '+R(d)+' vs credits '+R(c));chk(date);const j={id:uid(),date,ref,src,memo,lines,...meta};D.jr.push(j);return j}
const rev=(j,m)=>{const n=post('reversal',today(),j.ref,m,j.lines.map(l=>({a:l.a,c:l.c,dr:l.cr,cr:l.dr})),{of:j.id});[j,n].forEach(x=>x.lines.forEach(l=>{if(banks().some(b=>b.code==l.a)&&!l.m)l.m='x'}));return n};
const calc=(ls,inc,od=0)=>{let sub=0,tax=0,dsc=0;const out=ls.map(l=>{const g0=Math.round(l.q*l.p),g=Math.round(l.q*l.p*(1-(l.disc||0)/100)*(1-(od||0)/100)),r=TR[l.vat]||0;let t,n;if(inc){t=Math.round(g*r/(1+r));n=g-t}else{n=g;t=Math.round(n*r)}sub+=n;tax+=t;dsc+=g0-g;return{...l,n,t}});return{ls:out,sub,tax,total:sub+tax,dsc}};
const bal=d=>d.status=='void'?0:d.total-(d.paid||0);
function st(d){if(d.status=='void')return'Cancelled';if(d.status=='draft')return'Draft';if(d.kind=='sq')return['sent','draft'].includes(d.status)&&d.due<today()?'Expired':cap(d.status);if(d.kind=='po')return cap(d.status);if(d.kind[1]=='c')return'Applied';if(bal(d)<=0)return'Paid';return d.due<today()?'Overdue':d.paid>0?'Partially Paid':'Approved'}
function jl(d){const s=d.kind[0]=='s',cn=d.kind[1]=='c',L=[],f=(a,dr,cr)=>({a,dr,cr,c:d.cid});
if(s){L.push(f('1100',d.total,0));d.lines.forEach(l=>L.push(f(l.acc||'4000',0,l.n)));L.push(f('2100',0,d.tax));d.lines.forEach(l=>{const it=itm(l.item);if(it&&it.track){const v=Math.round(l.q*it.cost);L.push(f('5000',v,0),f('1200',0,v))}})}
else{d.lines.forEach(l=>{const it=itm(l.item);L.push(f(it&&it.track?'1200':(l.acc||'6000'),l.n,0))});L.push(f('1300',d.tax,0),f('2000',0,d.total))}
return cn?L.map(l=>({...l,dr:l.cr,cr:l.dr})):L}
function stock(d,sg){const sale=d.kind[0]=='s',cn=d.kind[1]=='c';d.lines.forEach(l=>{const it=itm(l.item);if(!it||!it.track)return;const dir=(sale?-1:1)*(cn?-1:1)*sg;if(!sale&&!cn&&dir>0){const t=it.stock+l.q;if(t>0)it.cost=Math.round((it.stock*it.cost+l.n)/t)}it.stock=Math.round((it.stock+dir*l.q)*1e4)/1e4})}
const cbal=(id,r)=>{const k=r=='c'?'si':'pi';return D.docs.filter(d=>d.cid==id&&d.kind==k&&d.status=='approved').reduce((s,d)=>s+bal(d),0)-D.pays.filter(p=>p.cid==id&&p.dir==(r=='c'?'in':'out')&&!p.void).reduce((s,p)=>s+p.un,0)};
function approve(d){if(d.status!='draft')throw Error('Already posted');const c=con(d.cid);d.snap=c&&{name:c.name,vat:c.vat,post:c.post||c.addr,phys:c.phys||c.addr};
if(d.kind=='sq'||d.kind=='po'){nextNo(d);d.status=d.kind=='sq'?'sent':'approved';log('Issued '+d.no);return}
chk(d.date);if(d.kind=='si'&&c&&c.limit&&cbal(c.id,'c')+d.total>c.limit&&!confirm('This customer will exceed their credit limit. Continue?'))throw Error('Cancelled');
const L=jl(d);nextNo(d);const j=post(d.kind,d.date,d.no,K[d.kind][0]+' '+d.no,L,{doc:d.id});stock(d,1);d.jid=j.id;d.status='approved';log('Posted '+d.no)}
const nextNo=(d,k=d.kind,p=K[k][1])=>{if(!d.no){let n;do{D.seq[k]=(D.seq[k]||0)+1;n=p+String(D.seq[k]).padStart(7,'0')}while(D.docs.some(x=>x.kind==k&&x.no==n&&x!=d));d.no=n}};
const prevNo=k=>{let q=D.seq[k]||0,n;do{q++;n=K[k][1]+String(q).padStart(7,'0')}while(D.docs.some(x=>x.kind==k&&x.no==n));return n};
function mkDoc(k,cid,ls,x={}){const c=con(cid),inc=x.inc??D.biz.inc,t=calc(ls,inc,x.od),dt=x.date||today(),d={id:uid(),kind:k,status:'draft',cid,date:dt,due:x.due||addD(dt,c?+c.terms||30:30),inc,lines:t.ls,sub:t.sub,tax:t.tax,total:t.total,dsc:t.dsc,paid:0,ref:'',notes:'',rep:'',od:0,terms:(D.biz.terms||{})[k]||'',...x};D.docs.push(d);return d}
function cx(d,r){if(d.jid){rev(D.jr.find(j=>j.id==d.jid),'Cancelled '+d.no+': '+r);stock(d,-1)}if(d.kind[1]=='c'&&d.src&&doc(d.src))doc(d.src).paid-=d.paid;if(d.kind[1]=='i'&&d.src){const q=doc(d.src);if(q&&q.status=='invoiced')q.status='sent'}nextNo(d);d.status='void';d.reason=r;d.cancelledOn=today();d.cancelledBy=CU&&CU.name;log('Cancelled '+d.no+': '+r)}
function voidDoc(id){const d=doc(id),nm={si:'invoice',sc:'credit note',pi:'bill',pc:'credit note',sq:'quote',po:'purchase order'}[d.kind];
if(!['draft','approved','sent','accepted','declined','invoiced'].includes(d.status))return err('This document cannot be cancelled.');
const lk=d.status=='invoiced'?D.docs.filter(x=>x.src==d.id&&x.kind==(d.kind=='sq'?'si':'pi')&&x.status!='void'):[],pd2=lk.find(x=>x.paid>0);
if(pd2)return err('Invoice '+pd2.no+' (from this '+nm+') has payments applied. Cancel the receipt first (Receipts / Payments tab), then cancel the '+nm+'.');
if(d.kind[1]=='i'&&d.paid>0)return err('This '+nm+' has payments applied. Cancel the receipt or payment first (Receipts / Payments tab), then cancel the '+nm+'.');
const r=prompt('Reason for cancelling the '+nm+' '+(d.no||'')+'?');if(!r)return;if(!confirm('Cancel this '+nm+(lk.length?' and its '+(d.kind=='sq'?'invoice ':'bill ')+lk.map(x=>x.no||'draft').join(', '):'')+'? It will show as Cancelled and be removed from your totals and reports.'))return;
try{if(d.jid||lk.some(x=>x.jid))chk(today());lk.forEach(x=>cx(x,(d.no||'Quote')+' cancelled: '+r));cx(d,r)}catch(e){return err(e.message)}save();go('#/doc/'+id)}
function renNo(id){const d=doc(id),n=(prompt('Document number',d.no||prevNo(d.kind))||'').trim();if(!n||n==d.no)return;if(D.docs.some(x=>x.kind==d.kind&&x.no==n&&x.id!=id))return err('The number '+n+' is already used.');log('Renumbered '+(d.no||'draft')+' to '+n);d.no=n;save();route()}
function voidPay(id){const p=D.pays.find(x=>x.id==id);if(!p||p.void)return;const j=D.jr.find(x=>x.id==p.jid);if(j&&j.lines.some(l=>l.m&&l.m!='x'))return err('This payment is matched on a bank statement. Unmatch it in Banking first.');const r=prompt('Reason for cancelling '+p.no+'?');if(!r)return;try{if(j)rev(j,'Cancelled '+p.no+': '+r)}catch(e){return err(e.message)}p.alloc.forEach(a=>{const d=doc(a.doc);if(d)d.paid-=a.amt});p.void=1;p.reason=r;log('Cancelled '+p.no+': '+r);save();route()}
function credit(id){const o=doc(id),k=o.kind=='si'?'sc':'pc',a=prompt('Credit amount incl. VAT (balance due '+R(bal(o))+')',(bal(o)/100).toFixed(2));if(a===null)return;const amt=C(a);if(amt<=0||amt>bal(o))return err('Credit must be above zero and not more than the balance due.');
