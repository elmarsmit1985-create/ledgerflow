try{if(m=='login'){const {data,error}=await sb.auth.signInWithPassword({email:e,password:pw});if(error)return say(error.message);return sbEnter(data.session)}
if(m=='signup'){const n=g('an').trim();if(!n)return say('Enter your name.');if(!/^\S+@\S+\.\S+$/.test(e))return say('Enter a valid email address.');const x=pwOk(pw,g('ac'));if(x)return say(x);const {data,error}=await sb.auth.signUp({email:e,password:pw,options:{data:{name:n},emailRedirectTo:SITE}});if(error)return say(error.message);if(data.session)return sbEnter(data.session);return auth('login','Check your email and click the confirmation link, then sign in here.')}
if(m=='forgot'){const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:SITE});if(error)return say(error.message);return auth('login','If that email has an account, a reset link is on its way.')}
if(m=='newpw'){const x=pwOk(pw,g('ac'));if(x)return say(x);const {error}=await sb.auth.updateUser({password:pw});if(error)return say(error.message);REC=0;const {data}=await sb.auth.getSession();return sbEnter(data.session)}
if(m=='biz'){const n=g('ab').trim();if(!n)return say('Enter your business name.');const hc=CUR[g('acur')]?g('acur'):'ZAR';BIZC={cur:hc,fx:readFx('a',hc)};const {error}=await sb.rpc('create_business',{n});if(error)return say(error.message);BIZN=n;const {data}=await sb.auth.getSession();return sbEnter(data.session)}}catch(x){say('Something went wrong: '+x.message)}}
const sbOut=()=>sb.auth.signOut().finally(()=>auth('login'));
async function logout(msg){if(!CU)return;clearTimeout(idle);try{await cloudSync()}catch(e){}CU=null;BID=null;U=[];try{localStorage.removeItem(KEY)}catch(e){}D=SEED();SN={};RV={};H('');closeM();location.hash='';sb.auth.signOut().finally(()=>auth('login',typeof msg=='string'?msg:''))}
async function boot(){if(!window.supabase)return auth('login','Could not load the cloud library. Check your connection and reload.');sb=supabase.createClient(SBU,SBK);
sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY'){REC=1;setTimeout(()=>auth('newpw'),0)}});
const {data}=await sb.auth.getSession();if(REC)return;if(data.session)await sbEnter(data.session);else auth('login')}
async function addU(){const g=x=>$('#'+x).value.trim(),e=g('ue').toLowerCase();if(!g('un')||!/^\S+@\S+\.\S+$/.test(e))return err('Enter a name and a valid email.');if(U.some(u=>u.email==e))return err('That email is already added.');const ro=$('#ur').value;
const {error}=await sb.from('invites').insert({business_id:BID,email:e,name:g('un'),role:ro,perm:ro=='admin'?{}:readPerm('n')});if(error)return err(error.message);log('Invited '+e);save();await loadUsers();route();alert('Added. Ask them to open the app, choose Create account with this same email address, and confirm it by email.')}
async function delU(id){const u=U.find(x=>x.id==id);if(!u)return;if(u.role=='admin'&&!u.inv&&U.filter(x=>x.role=='admin'&&!x.inv).length<2)return err('You cannot remove the only administrator.');if(!confirm('Remove '+u.name+'?'))return;
const r=u.inv?await sb.from('invites').delete().eq('business_id',BID).eq('email',u.email):await sb.from('members').delete().eq('business_id',BID).eq('user_id',u.id);if(r.error)return err(r.error.message);log('Removed user '+u.email);save();await loadUsers();route()}
async function saveAcc(id){const u=U.find(x=>x.id==id),perm=readPerm('m'),r=u.inv?await sb.from('invites').update({perm}).eq('business_id',BID).eq('email',u.email):await sb.from('members').update({perm}).eq('business_id',BID).eq('user_id',u.id);if(r.error)return err(r.error.message);log('Changed access for '+u.email);save();closeM();await loadUsers();route()}
const syncCard=()=>`<div class="card adm"><h3>Cloud sync</h3><p>Signed in as <b>${esc(CU.email)}</b>. ${esc(SYM)}</p><button class=b onclick="cloudSync()">Sync now</button></div>`;
addEventListener('online',()=>cloudSync());document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CU)cloudSync()});setInterval(()=>{if(CU&&!document.hidden)cloudSync()},6e4);

boot();
